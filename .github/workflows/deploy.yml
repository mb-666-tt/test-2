name: Przebudowa i wdrożenie na Vercel

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj środowisko pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Skonfiguruj środowisko Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Zainstaluj zależności
        run: pnpm install

      - name: Zbuduj aplikację
        run: pnpm build

      - name: Wdróż na Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
